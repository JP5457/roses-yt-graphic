<!DOCTYPE html> <title>Noticeboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/style.css') }}"
/>
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/background.css') }}"
/>
<body>
	<div
		id="sliding-background1"
		class="sliding-background"
		style="z-index: -2"
	>
		<div class="layer"></div>
	</div>
	<div
		id="sliding-background2"
		class="sliding-background"
		style="z-index: -1"
	>
		<div class="layer"></div>
	</div>
	<div class="container">
		<div class="thincolumn">
			<div class="contentbox">
				<h1 id="brokenlabel">Something Broken?</h1>
				<div id="brokenhtml"></div>
			</div>
			<div class="contentbox">
				<h1 id="joinlabel"></h1>
				<div id="joinhtml"></div>
			</div>
			<div class="contentbox">
				<h2 id="listenlabel"></h2>
				<div id="listenhtml"></div>
			</div>
			<div class="contentbox" id="extrabox">
				<h2 id="extralabel"></h2>
				<div id="extrahtml"></div>
			</div>
			<div class="contentbox">
				<h3 id="welfarelabel"></h3>
				<div id="welfarehtml"></div>
			</div>
		</div>

		<div class="thickcolumn"></div>
	</div>
</body>
<script>
	let startimage = 1;
</script>
<script
	src="{{ url_for('static', filename='scripts/background.js') }}"
	type="module"
></script>
<script
	src="{{ url_for('static', filename='scripts/main.js') }}"
	type="module"
></script>
