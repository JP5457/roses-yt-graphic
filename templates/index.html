<!DOCTYPE html> <title>rosesyt</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/style.css') }}"
/>
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/background.css') }}"
/>
<body>
	<div
		id="sliding-background1"
		class="sliding-background"
		style="z-index: -2"
	>
	</div>
	<div
		id="sliding-background2"
		class="sliding-background"
		style="z-index: -1"
	>
    </div>
	<div class="body-container">
		<div class="score-cont">
			<div class="top">
				<div class="york-score score">
					<h1>York</h1>
					<h1 id="york-score-val">0</h1>
				</div>
				<div class="bar-container">
					<div class="center-divider"></div>
					<div
						class="bar-section section1"
						id="section1"
						style="width: 33.3%"
					></div>
					<div
						class="bar-section section2"
						id="section2"
						style="width: 33.3%"
					></div>
					<div
						class="bar-section section3"
						id="section3"
						style="width: 33.3%"
					></div>
				</div>
				<div class="lancs-score score">
					<h1>Lancaster</h1>
					<h1 id="lancs-score-val">0</h1>
				</div>
			</div>
			<p>172.5 needed to win</p>
		</div>
		<div class="container">
			<div class="column">
				<div class="title">
					<h2>Live Now</h2>
				</div>
				<div class="column-content">
					<div class="fadeslist" id="fixtures-list-1">
						<div class="pad" id="fixlist-1">
							<p>Loading...</p>
						</div>
					</div>
					<div class="fadeslist" id="fixtures-list-2">
						<div class="pad" id="fixlist-2">
							<p>Loading...</p>
						</div>
					</div>
				</div>
				<div class="title">
					<h2>You Just Missed</h2>
				</div>
				<div class="column-content">
					<div class="fadeslist" id="catchup-list-1">
						<div class="pad" id="catchlist-1">
							<p>Loading...</p>
						</div>
					</div>
					<div class="fadeslist" id="catchup-list-2">
						<div class="pad" id="catchlist-2">
							<p>Loading...</p>
						</div>
					</div>
				</div>
			</div>

			<div class="column">
				<div class="title">
					<h2>Latest Scores</h2>
				</div>
				<div class="column-content">
					<div class="fades" id="scores-1">
						<div class="pad" id="fixtures-list-scores-1">
							<p>Loading...</p>
						</div>
					</div>
					<div class="fades" id="scores-2">
						<div class="pad" id="fixtures-list-scores-2">
							<p>Loading...</p>
						</div>
					</div>
				</div>
			</div>

			<div class="column" style="width: 40%;">
				<div class="bigcolumn" style="min-width: 100%;">
					<div class="title">
						<h2>Get scores, coverage and more at</h2>
						<h1>Roseslive.co.uk</h1>
					</div>
                    <div class="waveform">
                    </div>
					<div class="title">
                        <h1 >Now Live:</h1>
						<h1 id="nowPlaying">Coverage</h1>
					</div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script>
	let startimage = 1;
</script>
<script
	src="{{ url_for('static', filename='scripts/background.js') }}"
	type="module"
></script>
<script
	src="{{ url_for('static', filename='scripts/main.js') }}"
	type="module"
></script>
