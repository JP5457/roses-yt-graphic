<!DOCTYPE html> <title>Noticeboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/style.css') }}"
/>
<link
	rel="stylesheet"
	href="{{ url_for('static', filename='css/background.css') }}"
/>
<body>
	<div
		id="sliding-background1"
		class="sliding-background"
		style="z-index: -2"
	>
		<div class="layer"></div>
	</div>
	<div
		id="sliding-background2"
		class="sliding-background"
		style="z-index: -1"
	>
		<div class="layer"></div>
	</div>
	<div class="body-container">
		<div class="score-cont">
			<div class="top">
				<div class="york-score score">
					<h1>York</h1>
					<h1 id="york-score-val">0</h1>
				</div>
				<img src="https://assets-cdn.sums.su/YU/website/img/Roses/Roses_mark_Navigation.png" alt="">
				<div class="lancs-score score">
					<h1>Lancaster</h1>
					<h1 id="lancs-score-val">0</h1>
				</div>
			</div>
			<p>172.5 needed to win</p>
		</div>
		<div class="container">
			<div class="column">
				<div class="title">
					<h2>Live Now</h2>
					<h3>See the full lineup roses.live</h3>
				</div>
				<div class="column-content">
					<div class="pad" id="fixtures-list">
						<p>
							Loading...
						</p>
					</div>
				</div>
			</div>

			<div class="column">
				<div class="title">
					<h2>Latest Scores</h2>
					<h3>Showing last 6 results</h3>
				</div>
				<div class="column-content">
					<div class="pad" id="fixtures-list-scores">
						<p>
							Loading...
						</p>
					</div>
				</div>
			</div>
			
			<div class="column">
				<div class="title">
					<h2>Now Playing</h2>
					<h3>Listen to more on roses.live</h3>
				</div>
				<div class="column-content">
					<div class="pad">
						<div class="now-playing">
							<h3>
								Indoor Hockey: Women's 1st
							</h3>
						</div>
						<div class="waveform"></div>
					</div>
				</div>
			</div>

		</div>
	</div>
</body>
<script>
	let startimage = 1;
</script>
<script
	src="{{ url_for('static', filename='scripts/background.js') }}"
	type="module"
></script>
<script
	src="{{ url_for('static', filename='scripts/main.js') }}"
	type="module"
></script>
