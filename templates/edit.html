<!DOCTYPE html>
<html>
	<head>
		<title>Select a Fixture</title>
	</head>
	<body>
		<h1>Select a Fixture</h1>
		<form method="POST">
			<label for="fixture">Choose a fixture:</label>
			<select name="fixture" id="fixture">
				{% for fixture in fixtures %}
				<option value="{{ fixture.id }}">
					{{ fixture.title }} ({{ fixture.category }})
				</option>
				{% endfor %}
			</select>
			<button type="submit">Submit</button>
		</form>
	</body>
</html>
